<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>הגדרות - FlowCRM</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e3a5f">
</head>
<body>
<div class="app-shell">
  <div class="main">
    <h1 class="page-title">הגדרות</h1>
    <p class="page-subtitle">פרטי החברה ומספור מסמכים</p>

    <div class="card">
      <div class="section-bar">פרטי החברה</div>
      <div class="section-body">
        <div class="field-row">
          <div class="field"><label>שם החברה</label><input id="companyName"></div>
          <div class="field"><label>תיאור / עיסוק</label><input id="companyTagline"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>סוג עוסק</label>
            <select id="companyDealerType">
              <option>עוסק פטור</option>
              <option>עוסק מורשה</option>
            </select>
          </div>
          <div class="field"><label>ת.ז / ח.פ</label><input id="companyTaxId"></div>
        </div>
        <div class="field-row">
          <div class="field" style="flex-basis:100%"><label>כתובת</label><input id="companyAddress"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>טלפון</label><input id="companyPhone"></div>
          <div class="field"><label>אימייל</label><input id="companyEmail"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-bar">מע"מ ומספור מסמכים</div>
      <div class="section-body">
        <div class="field-row">
          <div class="field"><label>אחוז מע"מ</label><input id="vatRate" type="number" min="0" max="100"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>מספר חשבונית הבא</label><input id="nextInvoiceNumber" type="number"></div>
          <div class="field"><label>מספר קבלה הבאה</label><input id="nextReceiptNumber" type="number"></div>
          <div class="field"><label>מספר הצעת מחיר הבאה</label><input id="nextQuoteNumber" type="number"></div>
        </div>
        <div class="btn-row"><button class="btn btn-primary" id="saveBtn">שמירת הגדרות</button></div>
      </div>
    </div>

    <div class="card">
      <div class="section-bar">גיבוי ושחזור</div>
      <div class="section-body">
        <p style="font-size:13px;color:var(--text-muted);margin-top:0;">
          כל הנתונים נשמרים בדפדפן הזה בלבד. הורד גיבוי באופן קבוע ושמור אותו בגוגל דרייב כדי שהמידע לעולם לא ייעלם.
        </p>
        <div class="btn-row">
          <button class="btn btn-primary" id="exportBtn">⬇ הורדת גיבוי (JSON)</button>
          <button class="btn" id="importBtn">⬆ שחזור מגיבוי</button>
          <input type="file" id="importFile" accept="application/json" style="display:none;">
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
mountShell("settings.html");
const s = DB.getSettings();
document.getElementById("companyName").value = s.companyName;
document.getElementById("companyTagline").value = s.companyTagline;
document.getElementById("companyDealerType").value = s.companyDealerType;
document.getElementById("companyTaxId").value = s.companyTaxId;
document.getElementById("companyAddress").value = s.companyAddress;
document.getElementById("companyPhone").value = s.companyPhone;
document.getElementById("companyEmail").value = s.companyEmail;
document.getElementById("vatRate").value = s.vatRate;
document.getElementById("nextInvoiceNumber").value = s.nextInvoiceNumber;
document.getElementById("nextReceiptNumber").value = s.nextReceiptNumber;
document.getElementById("nextQuoteNumber").value = s.nextQuoteNumber;

document.getElementById("saveBtn").addEventListener("click", () => {
  const updated = {
    companyName: document.getElementById("companyName").value,
    companyTagline: document.getElementById("companyTagline").value,
    companyDealerType: document.getElementById("companyDealerType").value,
    companyTaxId: document.getElementById("companyTaxId").value,
    companyAddress: document.getElementById("companyAddress").value,
    companyPhone: document.getElementById("companyPhone").value,
    companyEmail: document.getElementById("companyEmail").value,
    vatRate: parseFloat(document.getElementById("vatRate").value) || 0,
    nextInvoiceNumber: parseInt(document.getElementById("nextInvoiceNumber").value) || 1,
    nextReceiptNumber: parseInt(document.getElementById("nextReceiptNumber").value) || 1,
    nextQuoteNumber: parseInt(document.getElementById("nextQuoteNumber").value) || 1,
  };
  DB.saveSettings(updated);
  toast("ההגדרות נשמרו");
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const backup = {
    exportedAt: new Date().toISOString(),
    settings: DB.getSettings(),
    clients: DB.getClients(),
    documents: DB.getDocuments(),
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `flowcrm-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!confirm("שחזור גיבוי יחליף את כל הנתונים הקיימים בדפדפן זה. להמשיך?")) return;
      if (data.settings) DB.saveSettings(data.settings);
      if (data.clients) DB.saveClients(data.clients);
      if (data.documents) DB.saveDocuments(data.documents);
      toast("הגיבוי שוחזר בהצלחה");
      setTimeout(() => location.href = "index.html", 800);
    } catch (err) {
      alert("קובץ הגיבוי אינו תקין");
    }
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
