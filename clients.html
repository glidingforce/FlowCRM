<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>לקוחות - FlowCRM</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e3a5f">
</head>
<body>
<div class="app-shell">
  <div class="main">
    <h1 class="page-title">לקוחות</h1>
    <p class="page-subtitle">ניהול פרטי לקוחות</p>

    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-primary" id="newClientBtn">+ לקוח חדש</button>
    </div>
    <div class="search-bar" style="margin-bottom:14px;"><input type="text" id="search" placeholder="חיפוש לפי שם, אימייל או ת.ז..."></div>

    <div id="list"></div>
  </div>
</div>

<!-- edit dialog -->
<div id="dialogBg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;align-items:center;justify-content:center;">
  <div class="card" style="width:92%;max-width:480px;max-height:88vh;overflow:auto;">
    <div class="section-bar" id="dialogTitle">לקוח חדש</div>
    <div class="section-body">
      <div class="field-row">
        <div class="field" style="flex-basis:100%"><label>שם החברה *</label><input id="fName"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>איש קשר</label><input id="fContact"></div>
        <div class="field"><label>טלפון</label><input id="fPhone"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>אימייל</label><input id="fEmail"></div>
        <div class="field"><label>ח.פ / ע.מ</label><input id="fTaxId"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>כתובת</label><input id="fAddress"></div>
        <div class="field"><label>עיר</label><input id="fCity"></div>
      </div>
      <div class="field-row">
        <div class="field" style="flex-basis:100%"><label>הערות</label><textarea id="fNotes"></textarea></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="saveClientBtn">שמירה</button>
        <button class="btn" id="closeDialogBtn">ביטול</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
mountShell("clients.html");
let editingId = null;
let query = "";

function render() {
  let clients = DB.getClients();
  if (query) {
    const q = query.toLowerCase();
    clients = clients.filter(c => (c.name||"").toLowerCase().includes(q) || (c.email||"").toLowerCase().includes(q) || (c.taxId||"").includes(q) || (c.phone||"").includes(q));
  }
  const list = document.getElementById("list");
  if (!clients.length) { list.innerHTML = `<div class="empty-state">אין לקוחות עדיין.</div>`; return; }
  list.innerHTML = clients.map(c => `
    <div class="client-card">
      <div>
        <div class="name">${c.name}</div>
        <div class="meta">
          ${c.contact ? c.contact + "<br>" : ""}
          ${c.phone ? `<a href="tel:${c.phone}">${c.phone}</a><br>` : ""}
          ${c.email ? `<a href="mailto:${c.email}">${c.email}</a><br>` : ""}
          ${c.address || c.city ? `${c.address || ""} ${c.city || ""}` : ""}
        </div>
      </div>
      <div class="actions">
        <button class="icon-btn" data-edit="${c.id}">✏</button>
        <button class="icon-btn danger" data-del="${c.id}">🗑</button>
      </div>
    </div>`).join("");

  list.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openDialog(b.dataset.edit)));
  list.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    if (!confirm("למחוק לקוח זה?")) return;
    DB.deleteClient(b.dataset.del);
    render();
  }));
}

function openDialog(id) {
  editingId = id || null;
  const c = id ? DB.getClient(id) : {};
  document.getElementById("dialogTitle").textContent = id ? "עריכת לקוח" : "לקוח חדש";
  document.getElementById("fName").value = c.name || "";
  document.getElementById("fContact").value = c.contact || "";
  document.getElementById("fPhone").value = c.phone || "";
  document.getElementById("fEmail").value = c.email || "";
  document.getElementById("fTaxId").value = c.taxId || "";
  document.getElementById("fAddress").value = c.address || "";
  document.getElementById("fCity").value = c.city || "";
  document.getElementById("fNotes").value = c.notes || "";
  document.getElementById("dialogBg").style.display = "flex";
}
function closeDialog() { document.getElementById("dialogBg").style.display = "none"; }

document.getElementById("newClientBtn").addEventListener("click", () => openDialog(null));
document.getElementById("closeDialogBtn").addEventListener("click", closeDialog);
document.getElementById("saveClientBtn").addEventListener("click", () => {
  const name = document.getElementById("fName").value.trim();
  if (!name) { toast("שם החברה הוא שדה חובה"); return; }
  const client = {
    id: editingId || uid("c"),
    name,
    contact: document.getElementById("fContact").value,
    phone: document.getElementById("fPhone").value,
    email: document.getElementById("fEmail").value,
    taxId: document.getElementById("fTaxId").value,
    address: document.getElementById("fAddress").value,
    city: document.getElementById("fCity").value,
    notes: document.getElementById("fNotes").value,
    active: true,
  };
  DB.upsertClient(client);
  closeDialog();
  render();
  toast("הלקוח נשמר");
});
document.getElementById("search").addEventListener("input", (e) => { query = e.target.value; render(); });

render();
</script>
</body>
</html>
