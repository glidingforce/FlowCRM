<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>מסמכים - FlowCRM</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e3a5f">
</head>
<body>
<div class="app-shell">
  <div class="main">
    <h1 class="page-title">מסמכים</h1>
    <p class="page-subtitle" id="countLabel"></p>

    <div class="search-bar"><input type="text" id="search" placeholder="חיפוש לפי לקוח, מספר מסמך או נושא עבודה..."></div>
    <div class="tabs" id="tabs">
      <button data-t="all" class="active">הכל</button>
      <button data-t="invoice">חשבוניות</button>
      <button data-t="receipt">קבלות</button>
      <button data-t="quote">הצעות מחיר</button>
    </div>

    <div class="doc-grid" id="grid"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
mountShell("documents.html");
let activeTab = "all";
let query = "";

function docTotal(d) {
  const subtotal = calcSubtotal(d.items || []);
  const tax = calcTax(subtotal, d.includeVat, DB.getSettings().vatRate);
  return calcTotal(subtotal, tax);
}

function render() {
  let docs = [...DB.getDocuments()].sort((a, b) => (b.issueDate || "").localeCompare(a.issueDate || ""));
  document.getElementById("countLabel").textContent = `מציג ${docs.length} מסמכים`;
  if (activeTab !== "all") docs = docs.filter(d => d.docType === activeTab);
  if (query) {
    const q = query.toLowerCase();
    docs = docs.filter(d =>
      (d.clientName || "").toLowerCase().includes(q) ||
      String(d.docNumber).includes(q) ||
      (d.workSubject || "").toLowerCase().includes(q));
  }
  const grid = document.getElementById("grid");
  if (!docs.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">לא נמצאו מסמכים.</div>`;
    return;
  }
  grid.innerHTML = docs.map(d => `
    <div class="doc-card">
      ${docBadge(d.docType)} ${statusBadge(d.status)}
      <div class="amount">${money(docTotal(d))}</div>
      <div class="name">${d.clientName || ""}</div>
      <div class="meta">מס' ${d.docNumber} · ${formatDateHe(d.issueDate)}</div>
      ${d.workSubject ? `<div class="meta">${d.workSubject}</div>` : ""}
      <div class="actions">
        <a class="btn" href="view.html?id=${d.id}">צפייה</a>
        <a class="btn" href="create.html?id=${d.id}">עריכה</a>
        ${d.isCanceled
          ? `<button class="btn btn-danger" data-del="${d.id}">מחק מסמך</button>`
          : `<button class="btn btn-danger" data-cancel="${d.id}">בטל מסמך</button>`}
      </div>
    </div>`).join("");

  grid.querySelectorAll("[data-cancel]").forEach(btn => btn.addEventListener("click", () => {
    if (!confirm("האם ברצונך לבטל מסמך זה?")) return;
    const d = DB.getDocument(btn.dataset.cancel);
    d.isCanceled = true; d.status = "canceled"; d.canceledAt = new Date().toISOString();
    DB.upsertDocument(d);
    render();
  }));
  grid.querySelectorAll("[data-del]").forEach(btn => btn.addEventListener("click", () => {
    if (!confirm("פעולה זו היא בלתי הפיכה. האם אתה בטוח?")) return;
    DB.deleteDocument(btn.dataset.del);
    render();
  }));
}

document.getElementById("tabs").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  activeTab = e.target.dataset.t;
  render();
});
document.getElementById("search").addEventListener("input", (e) => { query = e.target.value; render(); });

render();
</script>
</body>
</html>
